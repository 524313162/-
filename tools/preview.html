<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #1a1f1a; overflow: hidden; }
  #info { position: absolute; top: 10px; left: 10px; color: #33ff66; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>
<div id="info">loading...</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const url = params.get('url') || 'HQ_HexBuilding.glb';
const name = params.get('name') || url;
const focusY = parseFloat(params.get('focusY') || '0');   // 相机聚焦高度
const dist = parseFloat(params.get('dist') || '0');       // 相机距离 (0=自动)
const view = params.get('view') || '';                     // top = 俯视

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3240);
scene.fog = new THREE.Fog(0x2a3240, 30, 80);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14, 12, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);

// lights
scene.add(new THREE.HemisphereLight(0x8899bb, 0x334433, 0.9));
const sun = new THREE.DirectionalLight(0xffeecc, 1.6);
sun.position.set(10, 20, 8);
sun.castShadow = true;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x4466ff, 0.5);
rim.position.set(-10, 5, -10);
scene.add(rim);

// ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(40, 48),
  new THREE.MeshStandardMaterial({ color: 0x3a4038, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(40, 40, 0x556655, 0x334433);
grid.position.y = 0.01;
scene.add(grid);

new GLTFLoader().load(url, (gltf) => {
  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(model);
  document.getElementById('info').textContent = name;
  // auto-fit camera
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3()).length();
  const center = box.getCenter(new THREE.Vector3());
  if (focusY) center.y = focusY;
  const d = dist || size * 0.7;
  controls.target.copy(center);
  if (view === 'top') {
    camera.position.copy(center).add(new THREE.Vector3(0.01, d * 1.1, 0.01));
  } else {
    camera.position.copy(center).add(new THREE.Vector3(d*0.8, d*0.5, d*0.8));
  }
  camera.near = size/100; camera.far = size*10; camera.updateProjectionMatrix();
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
